<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Inquiry Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .form-header {
      margin-bottom: 24px;
    }

    .form-header h2 {
      font-size: 22px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 13px;
      font-weight: 400;
      color: #475569;
      cursor: pointer;
      line-height: 1.4;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #ff5a4e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #e0483c;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      color: #16a34a;
    }

    .status-msg.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2>Submit Project Inquiry</h2>
      <p>Fill out the details below to receive an automated AI proposal and quote.</p>
    </div>

    <form id="inquiryForm">
      <div class="form-row">
        <div class="form-group">
          <label for="client_name">Full Name *</label>
          <input type="text" id="client_name" name="client_name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="client_email">Email Address *</label>
          <input type="email" id="client_email" name="client_email" placeholder="john@company.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="company_name">Company Name *</label>
          <input type="text" id="company_name" name="company_name" placeholder="Acme Corp" required>
        </div>
        <div class="form-group">
          <label for="project_budget">Project Budget ($) *</label>
          <input type="number" id="project_budget" name="project_budget" placeholder="10000" min="500" required>
        </div>
      </div>

      <div class="form-group">
        <label for="timeline">Target Timeline *</label>
        <select id="timeline" name="timeline" required>
          <option value="Immediate">Immediate (&lt; 1 month)</option>
          <option value="1-3 Months" selected>1 - 3 Months</option>
          <option value="Flexible">Flexible / Just Exploring</option>
        </select>
      </div>

      <div class="form-group">
        <label for="project_details">Project Details & Requirements *</label>
        <textarea id="project_details" name="project_details" rows="4" placeholder="Describe the workflow, integrations, or automation tools you need built..." required></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="consent" name="consent" value="true" checked>
        <label for="consent">I agree to receive automated AI proposal emails and follow-up updates.</label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Inquiry</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('inquiryForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Replace with your active n8n Webhook URL
    const WEBHOOK_URL = 'YOUR_N8N_WEBHOOK_URL_HERE';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMsg.style.display = 'none';

      const formData = new FormData(form);
      const payload = {
        client_name: formData.get('client_name'),
        client_email: formData.get('client_email'),
        company_name: formData.get('company_name'),
        project_budget: Number(formData.get('project_budget')),
        timeline: formData.get('timeline'),
        project_details: formData.get('project_details'),
        consent: formData.get('consent') === 'true'
      };

      try {
        const response = await fetch('http://localhost:5678/webhook-test/lead-qualify-copy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMsg.className = 'status-msg success';
          statusMsg.innerText = 'Inquiry submitted successfully!';
          form.reset();
        } else {
          throw new Error('Server returned an error');
        }
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.innerText = 'Failed to submit. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Inquiry';
        statusMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
